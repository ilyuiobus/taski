name: Main Taski Workflow

on:
  push:
    branches:
      - main

jobs:
  backend_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          python manage.py test


  build_and_push:
    runs-on: ubuntu-latest
    needs: backend_tests

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t volinaiiv/taski_backend:latest \
            backend/

      - name: Build frontend image
        run: |
          docker build \
            -t volinaiiv/taski_frontend:latest \
            frontend/

      - name: Build gateway image
        run: |
          docker build \
            -t volinaiiv/taski_gateway:latest \
            gateway/

      - name: Push backend image
        run: |
          docker push volinaiiv/taski_backend:latest

      - name: Push frontend image
        run: |
          docker push volinaiiv/taski_frontend:latest

      - name: Push gateway image
        run: |
          docker push volinaiiv/taski_gateway:latest