[flake8]
ignore =
    W503,
    D100,
    D101,
    D102,
    D103,
    D104,
    D105,
    D106,
    D107,
    D200,
    D202,
    D205,
    D400,
    E203,
    F401

exclude =
    backend/*/migrations/*,
    backend/*/__init__.py,
    frontend/*,
    */venv/*,
    */env/*

per-file-ignores =
    backend/settings.py:E501